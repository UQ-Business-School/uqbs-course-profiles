name: UQ Course Profile Scrape

on:
  # Two weekly schedules (2026-09-07). Sunday 9pm AEST (11:00 UTC) scrapes the
  # UQBS courses for the current semesters, about ten minutes. Saturday 9pm AEST
  # (11:00 UTC Saturday) scrapes all of UQ for the two newest semester codes in the
  # JacSON index ("--semester recent"), which is what ATLAS's all-of-UQ picker reads;
  # it runs for a couple of hours. Neither needs a semester code edited in by hand.
  schedule:
    - cron: '0 11 * * 0'
    - cron: '0 11 * * 6'

  # Manual trigger with options
  workflow_dispatch:
    inputs:
      semester:
        description: 'Semester code to scrape (e.g. 7620 for Sem 1 2026). Leave blank for all current.'
        required: false
        type: string
      courses:
        description: 'Specific course codes (space-separated, e.g. MGTS1601 ACCT1101). Leave blank for all.'
        required: false
        type: string
      max_courses:
        description: 'Max courses to scrape (for testing). Leave blank for all.'
        required: false
        type: string
      all_uq:
        description: 'Scrape all of UQ (not just UQBS). Uses JacSON index as course list.'
        required: false
        type: boolean
        default: false

# Grant write permission so the workflow can push commits
permissions:
  contents: write
  actions: write   # so the scrape can dispatch the Pages deploy (see the last step)

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 330

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r scraper/requirements.txt

      - name: Run scraper
        env:
          # Authenticates the JacSON Tree API call (2026-08-25 hardening). Without it a
          # shared runner hits the anonymous rate limit and the run finds nothing.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ARGS=""
          if [ -n "${{ inputs.semester }}" ]; then
            ARGS="$ARGS --semester ${{ inputs.semester }}"
          fi
          if [ -n "${{ inputs.courses }}" ]; then
            ARGS="$ARGS --courses ${{ inputs.courses }}"
          fi
          if [ -n "${{ inputs.max_courses }}" ]; then
            ARGS="$ARGS --max ${{ inputs.max_courses }}"
          fi
          if [ "${{ inputs.all_uq }}" = "true" ]; then
            ARGS="$ARGS --all-uq"
          fi
          # The Saturday schedule is the all-of-UQ run for the two newest semesters.
          if [ "${{ github.event.schedule }}" = "0 11 * * 6" ]; then
            ARGS="--all-uq --semester recent"
          fi
          python scraper/scrape.py $ARGS

      - name: Rebuild site manifest
        if: always()
        run: |
          if [ -d "profiles" ] && [ "$(find profiles/ -name '*.json' 2>/dev/null)" ]; then
            python scraper/build_manifest.py
          else
            echo "No profiles — skipping manifest regen"
          fi

      # The AoL overlay (taxonomy/aol-status.json) is no longer rebuilt here: the
      # AoL register feed workflow (aol-register.yml) commits it with the CSV, and a
      # weekly rebuild only changed its timestamp and could collide with that run.

      - name: Carry LO mappings forward over the publishing fault
        if: always()
        run: python scraper/carry_forward_lo.py

      - name: Rebuild LO overrides overlay
        if: always()
        run: |
          if [ -f "taxonomy/lo-overrides.csv" ]; then
            python scraper/import_lo_overrides.py
          else
            echo "No LO overrides CSV — skipping"
          fi

      - name: Commit and push updated profiles
        if: always()
        run: |
          git config user.name "UQ Scraper Bot"
          git config user.email "uq-scraper[bot]@users.noreply.github.com"

          # Only add profiles if the directory has content
          if [ -d "profiles" ] && [ "$(find profiles/ -name '*.json' 2>/dev/null)" ]; then
            # docs/taxonomy is a gitignored symlink (the Pages workflow copies taxonomy/
            # in at deploy time). Adding it here made every scheduled run from 7 June to
            # 9 August 2026 scrape for half an hour and then fail at this line, so nothing
            # was ever committed. Fixed 2026-09-07.
            git add profiles/ docs/assets/manifest.json docs/assets/manifest-all.json docs/assets/manifest-legacy.json taxonomy/ logs/lo-carry-report.csv
            if git diff --cached --quiet; then
              echo "No changes to commit"
            else
              TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M UTC")
              PROFILE_COUNT=$(find profiles/ -name "*.json" | wc -l)
              git commit -m "Scrape update: ${PROFILE_COUNT} profiles as at ${TIMESTAMP}"
              # The AoL feed workflow may have pushed while this ran; the two touch different files.
              git push || { echo "Push refused; rebasing onto the latest main"; git pull --rebase --autostash origin main && git push; }
            fi
          else
            echo "No profile files found — skipping commit"
          fi

      - name: Redeploy the site with the new profiles
        # A push made with GITHUB_TOKEN never triggers another workflow, so the bot's
        # scrape commits never redeployed GitHub Pages: the feed ATLAS and the
        # teach.business viewer read stayed at whatever a person last pushed. A
        # workflow_dispatch is the documented exception, so dispatch the Pages deploy
        # by hand here (2026-09-07).
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run pages.yml --ref main || echo "Pages dispatch failed; push any commit to redeploy"

      - name: Upload scrape logs as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scrape-logs-${{ github.run_id }}
          path: logs/
          retention-days: 30
